body:
  text: 花木鳥獸集類類書類提要臣等謹案花木鳥獸集類三卷國朝吳寶芝撰寶芝石門貢生是書原本卷端題有臣吳寶芝恭纂字當是經進之本也所集花木鳥獸故實分門别類臚纂成書上卷凡四十三目中卷凡四十二目下卷凡二十五目蓋亦類書之體而卷帙不繁專掇取新頴字句以供詞藻之採擷上自經史諸子旁及漢唐以來稗官小說下至名人詩句無不博引兼收中間如三國典略瑞應圖字說等書久已佚亡亦不免從他書稗販之弊然所摘録大致猶稱雅贍蓋其意取纖麗為清異録之支流而泛濫及於詞章則又藝文類聚以來相沿之舊體雖徵据稍隘掛漏尚多而片語單辭往往可資考證以視冗雜蕪蔓者轉為足備檢核焉乾隆四十五年正月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀
  hash: sha256:29db9ac43b1364ad47fd8d9ff4ccc766e96e626b30e44d61b9afb49ec6bf8f90
