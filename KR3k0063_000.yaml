body:
  text: 花木鳥獸集𩔖𩔖書𩔖提要臣等謹案花木鳥獸集𩔖三卷國朝吳寳芝撰寳芝石門貢生是書原本卷端題有臣吳寳芝恭纂字當是經進之本也所集花木鳥獸故實分門别𩔖臚纂成書上卷凡四十三目中卷凡四十二目下卷凡二十五目葢亦𩔖書之體而卷帙不繁專掇取新頴字句以供詞藻之採擷上自經史諸子旁及漢唐以来稗官小説下至名人詩句無不博引兼收中間如三國典畧瑞應圖字説等書久已佚亡亦不免從他書稗販之弊然所摘録大致猶稱雅贍葢其意取纖麗為清異録之支流而泛濫及於詞章則又藝文𩔖聚以来相沿之舊體雖徵据稍隘掛漏尚多而片語單辭往往可資考證以視冗襍蕪蔓者轉為足備檢核焉乾隆四十五年正月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀
  hash: sha256:8b261c7f1dc03a06708a8642bd7364f26bc9a066baeb647ee2eb404b9d64d2ec
